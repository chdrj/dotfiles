# ─── tmux configuration ──────────────────────────────────────
# Read by tmux 3.x from $XDG_CONFIG_HOME/tmux/tmux.conf

# ── Prefix: C-Space (easier than C-b, no conflicts) ──────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Modern defaults ──────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"   # truecolor passthrough
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# ── vi mode in copy buffer ───────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Reload config in place ───────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ── Splits open in the current pane's directory ──────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── vim-style pane navigation ────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Sessionizer: prefix+f fuzzy-jumps between project sessions
bind-key -r f run-shell "tmux neww tmux-sessionizer"

# ─── Gruvbox-dark status bar ─────────────────────────────────
set -g status-position top
set -g status-style "bg=#282828,fg=#ebdbb2"
set -g status-left-length 50
set -g status-right-length 50
set -g status-left "#[fg=#fabd2f,bold]  #S #[fg=#928374]│ "
set -g status-right "#[fg=#928374]#H "
set -g window-status-format "#[fg=#928374] #I:#W "
set -g window-status-current-format "#[fg=#282828,bg=#fabd2f,bold] #I:#W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828,bold"
