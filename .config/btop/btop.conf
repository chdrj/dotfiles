#? Config file for btop v. 1.4+
# Only non-default keys are set here; btop fills the rest at runtime.

# Built-in gruvbox theme that matches the rest of the rice.
color_theme = "gruvbox_dark_v2"

# Use terminal background; lets kitty's blur/opacity show through.
theme_background = False

# Truecolor.
truecolor = True

# Force TTY mode off (we're in kitty).
force_tty = False

# Show greeting only the first time.
update_check = False

# Tree-style process view + vim keys.
proc_tree = False
vim_keys = True

# Refresh rate (ms). 1500 keeps the bar quiet without feeling laggy.
update_ms = 1500

# Sort processes by CPU usage descending.
proc_sorting = "cpu lazy"
proc_reversed = False
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_info_smaps = False
proc_left = False

# Show CPU per-core graph in a compact layout.
cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = True
cpu_single_graph = False
cpu_bottom = False
show_uptime = True
check_temp = True
cpu_sensor = "Auto"
show_coretemp = True
temp_scale = "celsius"
base_10_sizes = False
show_cpu_freq = True

# Clock at top.
clock_format = "%H:%M"
background_update = True

# Network interface auto-detect.
net_download = 100
net_upload = 100
net_auto = True
net_sync = True
net_iface = ""

# Disk view: show all + IO bars.
show_disks = True
only_physical = True
use_fstab = True
zfs_hide_datasets = False
disk_free_priv = False
show_io_stat = True
io_mode = True
io_graph_combined = False
io_graph_speeds = ""

# Mouse + selection.
selected_battery = "Auto"
show_battery = True

log_level = "WARNING"
