"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim "$@"', desc = "Open in Neovim", block = true },
]
open = [
  { run = 'open "$@"', desc = "Open with macOS default", orphan = true },
]
reveal = [
  { run = 'open -R "$1"', desc = "Reveal in Finder", orphan = true },
]
extract = [
  { run = 'unar "$1"', desc = "Extract archive" },
]
play = [
  { run = 'mpv --force-window "$@"', desc = "Play with mpv", orphan = true },
]

[open]
rules = [
  { name = "*/",                                 use = ["edit", "open", "reveal"] },
  { mime = "text/*",                             use = ["edit", "reveal"] },
  { mime = "image/*",                            use = ["open", "reveal"] },
  { mime = "video/*",                            use = ["play", "open", "reveal"] },
  { mime = "audio/*",                            use = ["play", "open", "reveal"] },
  { mime = "application/json",                   use = ["edit", "reveal"] },
  { mime = "application/zip",                    use = ["extract", "reveal"] },
  { mime = "application/x-7z-compressed",        use = ["extract", "reveal"] },
  { mime = "application/x-tar",                  use = ["extract", "reveal"] },
  { mime = "application/x-bzip2",                use = ["extract", "reveal"] },
  { mime = "application/x-gzip",                 use = ["extract", "reveal"] },
  { mime = "application/x-rar",                  use = ["extract", "reveal"] },
  { mime = "inode/x-empty",                      use = ["edit", "reveal"] },
  { mime = "*",                                  use = ["open", "reveal"] },
]
